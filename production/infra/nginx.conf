server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    # Container addresses change on recreate; resolve Docker service names per cache window.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $auth_backend auth:8000;
    set $wallet_backend wallet:8000;
    set $tuition_backend tuition:8000;
    set $payment_backend payment:8000;
    set $mail_backend mailpit:8025;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    location /internal { return 404; }
    location = /api/v1/auth/login { proxy_pass http://$auth_backend; }
    location = /api/v1/me { proxy_pass http://$auth_backend; }
    location = /api/v1/wallet { proxy_pass http://$wallet_backend; }
    location /api/v1/students/ { proxy_pass http://$tuition_backend; }
    location /api/v1/payments { proxy_pass http://$payment_backend; }
    location /api/ { return 404; }
    location /mail/ { proxy_pass http://$mail_backend; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
